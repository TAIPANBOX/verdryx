name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,traces]

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,traces]

      - name: Run Pytest
        run: pytest

      # A number in a README is a claim with no owner: right the day it is
      # written, and the suite grows in commits that never open the file. On
      # 2026-08-05 four of seven such figures on it-rat.com were found stale
      # against these repositories, and this one was among them: the page said
      # 217 tests where pytest collects 292.
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh
      - name: no optional dependency at module level
        run: ./scripts/optional-imports.sh
      - name: no priced grader runs by default
        run: ./scripts/no-paid-by-default.sh
      - name: exactly one runtime dependency
        run: ./scripts/one-runtime-dependency.sh
