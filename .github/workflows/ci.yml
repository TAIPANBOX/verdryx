name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,traces]

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,traces]

      - name: Run Pytest
        run: pytest

      # A number in a README is a claim with no owner: right the day it is
      # written, and the suite grows in commits that never open the file. On
      # 2026-08-05 four of seven such figures on it-rat.com were found stale
      # against these repositories, and this one was among them: the page said
      # 217 tests where pytest collects 292.
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh

      # A Gherkin scenario with no bound test is a paragraph that proves
      # nothing about the code. Checked in both directions: an unbound
      # scenario, and a binding that names a test which no longer exists.
      - name: every scenario is bound to a test that exists
        run: ./scripts/features-are-bound.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh
      - name: no optional dependency at module level
        run: ./scripts/optional-imports.sh
      - name: no priced grader runs by default
        run: ./scripts/no-paid-by-default.sh
      - name: exactly one runtime dependency
        run: ./scripts/one-runtime-dependency.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,traces]
          pip install pip-audit

      - name: Audit dependencies (pip-audit)
        # Checks the installed environment against known CVEs (PyPI advisory
        # DB). No ignored advisories: if this fails, the dependency needs a
        # fix, not a waiver.
        run: pip-audit --skip-editable
