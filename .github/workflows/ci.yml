name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Run Pytest with coverage
        run: |
          floor="$(grep -v '^[[:space:]]*#' .coverage-floor | tr -d '[:space:]')"
          pytest --cov=verdryx --cov-report=term-missing --cov-report=json:"$RUNNER_TEMP/coverage.json" --cov-fail-under="$floor"
      # The same total, read back from the report, with the slack and the gap
      # to the target in the job summary; and the floor only rises.
      - name: coverage is not below the floor
        run: ./scripts/coverage-floor.sh check "$RUNNER_TEMP/coverage.json"
      - name: the coverage floor only rises
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:.coverage-floor > "$RUNNER_TEMP/base-floor" 2>/dev/null || rm -f "$RUNNER_TEMP/base-floor"
          ./scripts/coverage-floor.sh ratchet "$RUNNER_TEMP/base-floor"

      # A number in a README is a claim with no owner: right the day it is
      # written, and the suite grows in commits that never open the file. On
      # 2026-08-05 four of seven such figures on it-rat.com were found stale
      # against these repositories, and this one was among them: the page said
      # 217 tests where pytest collects 292.
      - name: the README's numbers are true
        run: ./scripts/readme-numbers.sh

      # A Gherkin scenario with no bound test is a paragraph that proves
      # nothing about the code. Checked in both directions: an unbound
      # scenario, and a binding that names a test which no longer exists.
      - name: every scenario is bound to a test that exists
        run: ./scripts/features-are-bound.sh

      # A person's grade outweighs the model's, and whoever only uploads
      # results must have no path to write one. A test proves the door is
      # locked; this reads the package for a second door.
      - name: a human grade has one door
        run: ./scripts/human-grades-have-one-door.sh

      - name: no pipe ends in a grep that leaves early
        run: ./scripts/no-reader-leaves-a-pipe-early.sh

      # The chain hash has to agree byte for byte with the Go side, so the
      # canonical form stays delegated to rfc8785 (invariant 3).
      - name: canonical JSON is delegated, never hand-rolled
        run: ./scripts/canonical-json-is-delegated.sh

      # TokenFuse produces the traces; this plane only reads them (invariant 4).
      - name: traces are read, never written
        run: ./scripts/traces-are-read-not-written.sh

      # Last, because it mutates tracked files and restores them. It needs a
      # clean tree and says so plainly, so it also reports any earlier step
      # that starts writing into the checkout.
      - name: the gates above can still fail
        run: ./scripts/gates-have-teeth.sh
      - name: no optional dependency at module level
        run: ./scripts/optional-imports.sh
      - name: no priced grader runs by default
        run: ./scripts/no-paid-by-default.sh
      - name: exactly one runtime dependency
        run: ./scripts/one-runtime-dependency.sh
      - name: the lock resolves what pyproject.toml declares
        run: ./scripts/lock-satisfies-pyproject.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + pip-audit
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
          pip install pip-audit

      - name: Audit dependencies (pip-audit)
        # Checks the installed environment against known CVEs (PyPI advisory
        # DB). No ignored advisories: if this fails, the dependency needs a
        # fix, not a waiver.
        run: pip-audit --skip-editable
