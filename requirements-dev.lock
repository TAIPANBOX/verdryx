# Pinned resolution for the dev/test/CI environment: `pip install -e '.[dev,traces]'`.
#
# pyproject.toml keeps `>=` floors as the declared surface (invariant 1: the
# runtime core has exactly one dependency, and the two extras stay optional
# extras). This file is the exact resolution CI and a developer install from,
# so "it works on my machine" means the same versions everywhere instead of
# whatever floor-satisfying set pip happens to pick that day.
#
# This lock is complete for the interpreter CI actually runs, Python 3.11
# (`.github/workflows/ci.yml`). A resolution taken on a different interpreter
# can omit a conditional dependency 3.11 needs: `referencing==0.37.0` requires
# `typing-extensions>=4.4.0; python_version<"3.13"`, invisible to `pip freeze`
# on any interpreter that clause excludes, so it is pinned by hand below.
#
# Generated with:
#   .venv/bin/pip install -e '.[dev,traces]'
#   .venv/bin/pip freeze
# then the editable `verdryx` line removed (that one is installed separately,
# with `-e . --no-deps`, from the checkout being built), and every other line
# `pip freeze` wrote for a tool that is not part of the dev/test install
# (`pip-audit`'s own dependency tree) removed by hand, since that command
# only ran here to audit the venv, not because the dev/test path needs it.
#
# The `anthropic` extra is deliberately NOT in this lock: CI never installs
# it (`pip install -e .[dev,traces]`, no `anthropic`), and nothing in the
# dev/test path imports it. Locking a group nothing installs would pin a
# version nobody's install ever resolves, which is worse than not pinning it.
#
# Regenerate the same way after changing a floor in pyproject.toml:
#   python3 -m venv /tmp/verdryx-lock && /tmp/verdryx-lock/bin/pip install -e '.[dev,traces]'
#   /tmp/verdryx-lock/bin/pip freeze | grep -v '^-e ' > requirements-dev.lock
# then restore this header comment and re-filter to the dev/test set
# (`pip freeze` does neither).
